services:
  - type: web
    name: rg-thrift-collection
    env: node
    region: singapore
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: rg-thrift-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: APP_URL
        value: https://rg-thrift-collection.onrender.com
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: RECAPTCHA_SITE_KEY
        sync: false
      - key: RECAPTCHA_SECRET_KEY
        sync: false
      - key: GCASH_ACCOUNT_NAME
        sync: false
      - key: GCASH_MOBILE_NUMBER
        sync: false
      - key: GCASH_QR_CODE_URL
        sync: false
      - key: COD_RESERVATION_MINUTES
        value: 1440
      - key: RESERVATION_MINUTES
        value: 30
    disk:
      name: rg-thrift-uploads
      mountPath: /var/data/public/uploads
      sizeGB: 1

databases:
  - name: rg-thrift-db
    plan: free
    region: singapore
    ipAllowList: []